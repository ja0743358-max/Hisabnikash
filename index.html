<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>আল-আকসা ফাউন্ডেশন হিসাব</title><meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="হিসাব">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--c:#fff;--t:#1a2b22;--m:#64748b;--p:#0f766e;--b:#d9e2dd;--d:#dc2626;--g:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--c:#17231e;--t:#e6efe9;--m:#93a39a;--p:#2dd4bf;--b:#2a3a33;--d:#f87171;--g:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--c:#17231e;--t:#e6efe9;--m:#93a39a;--p:#2dd4bf;--b:#2a3a33;--d:#f87171;--g:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.5 "Noto Sans Bengali",system-ui,sans-serif;padding-bottom:70px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--p);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .lg{width:38px;height:38px;border-radius:50%;background:#fff3;display:grid;place-items:center;overflow:hidden;font-size:22px}header img{width:100%;height:100%;object-fit:cover}
main{padding:12px;max-width:760px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:7px 0;font:inherit;font-size:19px;display:flex;flex-direction:column;align-items:center}nav button span{font-size:11px}nav .on{color:var(--p);font-weight:700}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}.st small{color:var(--m)}.st b{display:block;font-size:20px}
button,select,input,textarea{font:inherit;color:var(--t)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:9px;background:var(--bg);margin:3px 0 8px}
button{padding:8px 12px;border:1px solid var(--b);border-radius:9px;background:var(--c);cursor:pointer}.pri{background:var(--p);color:#fff;border-color:var(--p)}.dan{background:var(--d);color:#fff;border-color:var(--d)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1}
.mr{display:flex;gap:10px;align-items:center;cursor:pointer}.pv{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--b)}.mr .pv{flex:none}
.ph{display:flex;align-items:center;gap:10px}.ph img{width:50px;height:50px;object-fit:contain}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mg button{padding:8px 2px;font-size:13px}.mg .pd{background:var(--g);color:#fff;border-color:var(--g)}
.in{color:var(--g)}.out{color:var(--d)}.m{color:var(--m)}.ys{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0}.ys b{font-size:17px}
#md{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.box{background:var(--c);border-radius:14px;padding:14px;width:100%;max-width:520px;margin:auto}
label{font-size:13px;color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--b);padding:4px 6px;text-align:left}th{background:var(--bg)}.sc{overflow-x:auto}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}#pa *{color:#000!important;border-color:#999!important}.pb{page-break-after:always}body{padding:0}}
</style></head><body>
<div id="app"></div><div id="md" onclick="if(event.target==this)X()"></div><div id="pa"></div>
<script>
const $=s=>document.querySelector(s);
let S={settings:{name:'আল-আকসা ফাউন্ডেশন',logo:'',fee:100},members:[],pays:[],txs:[]};
let Y=new Date().getFullYear(),tab='home',q='',tf='all',R={k:'all',m:0},tmp={};
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const money=n=>'৳'+bn(Number(n||0).toLocaleString('en-US'));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function idb(){return new Promise((r,j)=>{const o=indexedDB.open('aqsa',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onsuccess=()=>r(o.result);o.onerror=()=>j()})}
async function load(){try{const d=await idb();const v=await new Promise(r=>{const g=d.transaction('k').objectStore('k').get('db');g.onsuccess=()=>r(g.result);g.onerror=()=>r()});if(v)S=v}catch(e){try{const v=localStorage.getItem('aqsa');if(v)S=JSON.parse(v)}catch(e){}}}
async function save(){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(S,'db')}catch(e){try{localStorage.setItem('aqsa',JSON.stringify(S))}catch(e){}}}
function M(h){$('#md').innerHTML='<div class="box">'+h+'</div>';$('#md').style.display='flex'}
function X(){$('#md').style.display='none'}
function conf(msg,fn){M('<p>'+msg+'</p><div class="row"><button class="dan" onclick="window.cf()">হ্যাঁ, মুছুন</button><button onclick="X()">না</button></div>');window.cf=fn}
function rs(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};i.src=r.result};r.readAsDataURL(f)}
function pick(el,k){const f=el.files[0];if(!f)return;rs(f,k=='logo'?260:320,d=>{tmp[k]=d;$('#pv_'+k).innerHTML='<img class="pv" src="'+d+'">'})}
function ask(title,F,cb){tmp={};
M('<h3>'+title+'</h3>'+F.map(f=>f.t=='photo'?'<label>'+f.l+'</label><input type="file" accept="image/*" onchange="pick(this,\''+f.k+'\')"><div id="pv_'+f.k+'">'+(f.v?'<img class="pv" src="'+f.v+'">':'')+'</div>':f.t=='sel'?'<label>'+f.l+'</label><select id="f_'+f.k+'">'+f.o.map(o=>'<option value="'+o[0]+'"'+(o[0]==f.v?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>':'<label>'+f.l+'</label><input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(f.v)+'"'+(f.t=='number'?' inputmode="decimal"':'')+'>').join('')+'<div class="row"><button class="pri" onclick="window.sv()">সংরক্ষণ</button><button onclick="X()">বাতিল</button></div>');
window.sv=()=>{const v={};F.forEach(f=>{v[f.k]=f.t=='photo'?(tmp[f.k]!==undefined?tmp[f.k]:f.v):$('#f_'+f.k).value.trim()});cb(v)}}
function go(t){tab=t;q='';render();scrollTo(0,0)}
function setY(d){Y+=d;render()}
const ys=()=>'<div class="ys"><button onclick="setY(-1)">◀</button><b>'+bn(Y)+'</b><button onclick="setY(1)">▶</button></div>';
const mp=(id,y)=>S.pays.filter(p=>p.mid==id&&p.y==y);
const sum=a=>a.reduce((s,x)=>s+Number(x.amt),0);
const txY=(y,t,m)=>S.txs.filter(x=>x.date.slice(0,4)==y&&(!t||x.type==t)&&(!m||+x.date.slice(5,7)==m));
function stats(y){const c=sum(S.pays.filter(p=>p.y==y)),i=sum(txY(y,'in')),o=sum(txY(y,'out'));return{c,i,o,bal:c+i-o}}
const V={
home(){const s=stats(Y),cm=new Date().getMonth()+1,paid=S.members.filter(m=>S.pays.some(p=>p.mid==m.id&&p.y==Y&&p.m==cm)).length;
return ys()+'<div class="grid"><div class="st"><small>মোট সদস্য</small><b>'+bn(S.members.length)+'</b></div><div class="st"><small>চাঁদা আদায়</small><b class="in">'+money(s.c)+'</b></div><div class="st"><small>অন্যান্য আয়</small><b class="in">'+money(s.i)+'</b></div><div class="st"><small>মোট ব্যয়</small><b class="out">'+money(s.o)+'</b></div></div><div class="card" style="margin-top:8px"><small class="m">বর্তমান জমা (ব্যালেন্স)</small><b style="font-size:26px;display:block">'+money(s.bal)+'</b></div><div class="card">এই মাসে চাঁদা দিয়েছেন: <b>'+bn(paid)+'</b> জন · বাকি: <b>'+bn(S.members.length-paid)+'</b> জন</div><div class="card m">⚠️ তথ্য শুধু এই ফোন/ব্রাউজারে জমা থাকে। সেটিংস থেকে নিয়মিত ব্যাকআপ কপি করে রাখুন।</div>'},
mem(){return '<button class="pri" style="width:100%;margin-bottom:8px" onclick="mf()">➕ নতুন সদস্য</button><input placeholder="🔍 নাম বা আইডি দিয়ে খুঁজুন" value="'+esc(q)+'" oninput="q=this.value;$(\'#ml\').innerHTML=ml()">'+ys()+'<div id="ml">'+ml()+'</div>'},
tx(){const l=txY(Y).filter(x=>tf=='all'||x.type==tf).sort((a,b)=>b.date.localeCompare(a.date));
return '<div class="row"><button class="pri" onclick="tf2(\'in\')">➕ আয়</button><button class="dan" onclick="tf2(\'out\')">➖ ব্যয়</button></div>'+ys()+'<div class="row">'+[['all','সব'],['in','আয়'],['out','ব্যয়']].map(a=>'<button class="'+(tf==a[0]?'pri':'')+'" onclick="tf=\''+a[0]+'\';render()">'+a[1]+'</button>').join('')+'</div>'+(l.length?l.map(x=>'<div class="card"><div class="row" style="margin:0;align-items:center"><div style="flex:3"><b>'+esc(x.title)+'</b><br><small class="m">'+bn(x.date)+(x.note?' · '+esc(x.note):'')+'</small></div><b class="'+x.type+'" style="text-align:right">'+(x.type=='in'?'+':'−')+money(x.amt)+'</b></div><div class="row" style="margin:6px 0 0"><button onclick="tf2(\''+x.type+'\',\''+x.id+'\')">✏️ এডিট</button><button onclick="dt(\''+x.id+'\')">🗑️ মুছুন</button></div></div>').join(''):'<p class="m">কোনো এন্ট্রি নেই</p>')},
rep(){return ys()+'<div class="card"><label>রিপোর্টের ধরন</label><select id="rk" onchange="R.k=this.value;rp()">'+[['all','সম্পূর্ণ আয়-ব্যয় রিপোর্ট'],['chanda','সদস্যদের চাঁদা তালিকা (সকলের)'],['in','শুধু অন্যান্য আয়'],['out','শুধু ব্যয়'],['each','সকল সদস্যের আলাদা বিবরণ']].map(a=>'<option value="'+a[0]+'"'+(R.k==a[0]?' selected':'')+'>'+a[1]+'</option>').join('')+'</select><label>মাস</label><select id="rm" onchange="R.m=+this.value;rp()"><option value="0">সারা বছর</option>'+MN.map((n,i)=>'<option value="'+(i+1)+'"'+(R.m==i+1?' selected':'')+'>'+n+'</option>').join('')+'</select><button class="pri" style="width:100%" onclick="P(rh())">🖨️ প্রিন্ট / PDF</button></div><div class="card sc" id="rp">'+rh()+'</div>'},
set(){const s=S.settings;return instCard()+'<div class="card"><h3 style="margin-top:0">সংগঠনের তথ্য</h3><label>সংগঠনের নাম</label><input id="sn" value="'+esc(s.name)+'"><label>মাসিক চাঁদার ডিফল্ট পরিমাণ (৳)</label><input id="sf" type="number" inputmode="decimal" value="'+s.fee+'"><label>লোগো আপলোড</label><input type="file" accept="image/*" onchange="pick(this,\'logo\')"><div id="pv_logo">'+(s.logo?'<img class="pv" src="'+s.logo+'">':'')+'</div><div class="row"><button class="pri" onclick="ss()">সংরক্ষণ</button>'+(s.logo?'<button onclick="S.settings.logo=\'\';save();render()">লোগো মুছুন</button>':'')+'</div></div><div class="card"><h3 style="margin-top:0">ব্যাকআপ</h3><div class="row"><button onclick="bk()">📋 ব্যাকআপ কপি</button><button onclick="rsr()">♻️ রিস্টোর</button></div><button class="dan" style="width:100%" onclick="conf(\'সব তথ্য চিরতরে মুছে যাবে!\',()=>{S={settings:S.settings,members:[],pays:[],txs:[]};save();X();render()})">⚠️ সব তথ্য মুছুন</button></div>'}};
function ml(){const k=q.trim().toLowerCase(),l=S.members.filter(m=>!k||m.name.toLowerCase().includes(k)||String(m.sid).toLowerCase().includes(k));
return l.length?l.map(m=>{const p=mp(m.id,Y);return '<div class="card mr" onclick="dm(\''+m.id+'\')">'+(m.photo?'<img class="pv" src="'+m.photo+'">':'<div class="pv" style="display:grid;place-items:center">👤</div>')+'<div style="flex:1"><b>'+esc(m.name)+'</b><br><small class="m">আইডি: '+esc(m.sid)+'</small></div><div style="text-align:right"><b>'+bn(p.length)+'/১২</b><br><small class="in">'+money(sum(p))+'</small></div></div>'}).join(''):'<p class="m">কোনো সদস্য পাওয়া যায়নি</p>'}
function mf(id){const m=S.members.find(x=>x.id==id)||{};ask(id?'সদস্য এডিট':'নতুন সদস্য',[{k:'name',l:'নাম *',v:m.name},{k:'sid',l:'সদস্য আইডি নম্বর *',v:m.sid},{k:'phone',l:'মোবাইল (ঐচ্ছিক)',t:'tel',v:m.phone},{k:'photo',l:'ছবি',t:'photo',v:m.photo}],v=>{
if(!v.name||!v.sid)return alert2('নাম ও আইডি দিতে হবে');
if(S.members.some(x=>x.id!=id&&String(x.sid)==v.sid))return alert2('এই আইডি আগেই আছে');
if(id)Object.assign(m,v);else S.members.push({id:uid(),...v});save();X();render()})}
function alert2(t){const e=$('.box');if(e&&!$('#al'))e.insertAdjacentHTML('afterbegin','<p id="al" class="out">'+t+'</p>');else if($('#al'))$('#al').textContent=t}
function dm(id){const m=S.members.find(x=>x.id==id);if(!m)return X();const ps=mp(id,Y);
M('<div class="mr" style="cursor:default">'+(m.photo?'<img class="pv" src="'+m.photo+'">':'')+'<div><b style="font-size:17px">'+esc(m.name)+'</b><br>আইডি: '+esc(m.sid)+(m.phone?'<br>'+esc(m.phone):'')+'</div></div>'+ys().replace(/setY\((-?1)\)/g,'setY($1);dm(\''+id+'\')')+'<div class="mg">'+MN.map((n,i)=>{const p=ps.find(x=>x.m==i+1);return '<button class="'+(p?'pd':'')+'" onclick="pm(\''+id+'\','+(i+1)+')">'+n+'<br>'+(p?money(p.amt):'বাকি')+'</button>'}).join('')+'</div><p><b>মোট: '+money(sum(ps))+'</b> · '+bn(ps.length)+'/১২ মাস</p><div class="row"><button onclick="P(mh(S.members.find(x=>x.id==\''+id+'\'),Y))">🖨️ প্রিন্ট</button><button onclick="wa(\''+id+'\')">💬 WhatsApp</button><button onclick="cp(\''+id+'\')">📋 কপি</button></div><div class="row"><button onclick="mf(\''+id+'\')">✏️ এডিট</button><button class="dan" onclick="dmm(\''+id+'\')">🗑️ মুছুন</button><button onclick="X()">বন্ধ</button></div>')}
function ysFix(){}
function pm(id,mo){const p=S.pays.find(x=>x.mid==id&&x.y==Y&&x.m==mo);ask(MN[mo-1]+' '+bn(Y)+' এর চাঁদা'+(p?' (০ দিলে মুছে যাবে)':''),[{k:'amt',l:'টাকা',t:'number',v:p?p.amt:S.settings.fee},{k:'date',l:'তারিখ',t:'date',v:p?p.date:today()}],v=>{const a=+v.amt||0;if(p){if(a>0){p.amt=a;p.date=v.date||p.date}else S.pays=S.pays.filter(x=>x!=p)}else if(a>0)S.pays.push({id:uid(),mid:id,y:Y,m:mo,amt:a,date:v.date||today()});save();dm(id);render()})}
function dmm(id){conf('এই সদস্য ও তার সব চাঁদার হিসাব মুছে যাবে।',()=>{S.members=S.members.filter(x=>x.id!=id);S.pays=S.pays.filter(x=>x.mid!=id);save();X();render()})}
function mt(m,y){const ps=mp(m.id,y);return '*'+S.settings.name+'*\nনাম: '+m.name+'\nআইডি: '+m.sid+'\nবছর: '+bn(y)+'\n'+MN.map((n,i)=>{const p=ps.find(x=>x.m==i+1);return n+': '+(p?money(p.amt)+' ✓':'বাকি')}).join('\n')+'\nমোট জমা: '+money(sum(ps))}
function wa(id){window.open('https://wa.me/?text='+encodeURIComponent(mt(S.members.find(x=>x.id==id),Y)),'_blank')}
function cp(id){const t=mt(S.members.find(x=>x.id==id),Y);try{navigator.clipboard.writeText(t).then(()=>alert2('কপি হয়েছে ✓'))}catch(e){M('<textarea rows="12" onfocus="this.select()">'+esc(t)+'</textarea><button onclick="X()">বন্ধ</button>')}}
function tf2(t,id){const x=S.txs.find(y=>y.id==id)||{};ask((id?'এডিট – ':'নতুন ')+(t=='in'?'আয়':'ব্যয়'),[{k:'title',l:'বিবরণ *',v:x.title},{k:'amt',l:'টাকা *',t:'number',v:x.amt},{k:'date',l:'তারিখ',t:'date',v:x.date||today()},{k:'note',l:'নোট (ঐচ্ছিক)',v:x.note}],v=>{if(!v.title||!(+v.amt>0))return alert2('বিবরণ ও টাকা দিন');v.amt=+v.amt;v.date=v.date||today();if(id)Object.assign(x,v);else S.txs.push({id:uid(),type:t,...v});save();X();render()})}
function dt(id){conf('এই এন্ট্রি মুছে ফেলবেন?',()=>{S.txs=S.txs.filter(x=>x.id!=id);save();X();render()})}
function ss(){S.settings.name=$('#sn').value.trim()||'আল-আকসা ফাউন্ডেশন';S.settings.fee=+$('#sf').value||0;if(tmp.logo)S.settings.logo=tmp.logo;save();render()}
function bk(){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>M('<p>ব্যাকআপ কপি হয়েছে ✓ কোথাও (নোট/WhatsApp) পেস্ট করে রাখুন।</p><button onclick="X()">ঠিক আছে</button>'))}catch(e){M('<textarea rows="10" onfocus="this.select()">'+esc(t)+'</textarea><button onclick="X()">বন্ধ</button>')}}
